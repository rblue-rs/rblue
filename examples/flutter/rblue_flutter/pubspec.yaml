name: rblue_flutter
description: >-
  Experimental Flutter BLE plugin backed by rblue's Rust C ABI for Android,
  iOS, macOS, and Windows.
version: 0.0.1-dev.2
homepage: https://github.com/rblue-rs/rblue
repository: https://github.com/rblue-rs/rblue
issue_tracker: https://github.com/rblue-rs/rblue/issues
topics:
  - bluetooth
  - ble
  - ffi
  - rust

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.7"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.rblue.rblue_flutter
        pluginClass: RblueFlutterPlugin
      ios:
        pluginClass: RblueFlutterPlugin
      macos:
        pluginClass: RblueFlutterPlugin
      windows:
        ffiPlugin: true
