name: rblue_flutter
description: >-
  Local Flutter plugin for the rblue example: a Dart client over the
  message-passing rblue-c C ABI (ffigen bindings + prebuilt libraries).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.rblue.rblue_flutter
        pluginClass: RblueFlutterPlugin
      ios:
        pluginClass: RblueFlutterPlugin
