[workspace]
resolver = "2"
members = [
  "crates/rblue-api",
  "crates/rblue-mock",
  "crates/rblue",
  "crates/rblue-android",
  "crates/rblue-corebluetooth",
  "crates/rblue-winrt",
  "crates/rblue-c",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rblue-rs/rblue"

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
futures-timer = "3"
bitflags = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
proptest = "1"
rblue-api = { version = "0.1.0", path = "crates/rblue-api" }
rblue-mock = { version = "0.1.0", path = "crates/rblue-mock" }
