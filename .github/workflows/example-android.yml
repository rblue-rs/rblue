# Android example: 4-ABI binding pipeline + Gradle builds + unit tests.
#
# Owned by the Android example plan (examples/ANDROID_PLAN.md); see
# examples/README.md for the non-interference contract. GitHub's
# ubuntu-latest runners ship the Android SDK (with NDK and accepted
# licenses); the Rust .so pipeline runs through
# examples/android/scripts/build-bindings.sh. The Android emulator has no
# Bluetooth hardware, so CI builds the mock flavor for installability and
# runs mock-level JVM unit tests only; device acceptance is documented in
# examples/android/README.md.
name: example-android

# GitHub-hosted jobs in this file are workflow_dispatch only while
# hosted billing is blocked. An absent automatic run is not a pass.
# These jobs assume a Linux hosted image with the Android SDK/NDK.
on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build bindings (real 4 ABI + mock 2 ABI + Kotlin bindings)
        run: examples/android/scripts/build-bindings.sh

      # The script regenerates bindings/kotlin/generated; a dirty tree means
      # the committed copy is stale.
      - name: Fail if committed generated sources drifted
        run: git diff --exit-code -- bindings/kotlin

      - name: Gradle assembleDebug (real + mock flavors)
        working-directory: examples/android
        run: ./gradlew :app:assembleRealDebug :app:assembleMockDebug

      # Release minifies (R8): exercises the AAR's consumer-rules.pro keep
      # rules on every CI run (M-A3).
      - name: Gradle assembleRelease (minify, both flavors)
        working-directory: examples/android
        run: ./gradlew :rblue:assembleRelease :app:assembleRelease

      - name: Unit tests (JSON contract, backoff, scan dedup, error text)
        working-directory: examples/android
        run: ./gradlew test
