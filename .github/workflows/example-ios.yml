# iOS example: XCFramework pipeline + simulator build + unit tests.
#
# Owned by the iOS example plan (examples/IOS_PLAN.md); see
# examples/README.md for the non-interference contract. The iOS Simulator has
# no Bluetooth hardware, so CI builds and runs mock-level unit tests only;
# device acceptance is documented in examples/ios/README.md.
name: example-ios

# Runs on the repository-only rblue-m4 self-hosted runner. Trusted-code
# only (same-repository heads). No pull_request_target. No GitHub cache
# or artifact uploads (avoid storage fees). This does not cover Android,
# Windows, or Flutter package jobs.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/example-ios.yml"
      - "bindings/swift/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/ios/**"
  pull_request:
    paths:
      - ".github/workflows/example-ios.yml"
      - "bindings/swift/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/ios/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    if: ${{ github.repository == 'rblue-rs/rblue' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, rblue-m4, rblue-trusted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure Rust iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Ensure XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Build XCFramework and Swift bindings
        run: examples/ios/scripts/build-frameworks.sh

      # The script syncs the generated Swift module into the SPM package;
      # a dirty tree means the committed copy is stale.
      - name: Fail if committed generated sources drifted
        run: git diff --exit-code -- bindings/swift

      - name: Generate Xcode project
        working-directory: examples/ios
        run: xcodegen generate

      # Links the simulator slice of the XCFramework.
      - name: Build app (iOS Simulator)
        working-directory: examples/ios
        run: >-
          xcodebuild -project RblueExample.xcodeproj -scheme RblueExample
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO

      # Links the device slice of the XCFramework (no signing needed for a
      # generic build).
      - name: Build app (generic iOS device)
        working-directory: examples/ios
        run: >-
          xcodebuild -project RblueExample.xcodeproj -scheme RblueExample
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO

      # Unit tests are mock-level (fakes + JSON contract) and run on any
      # available iPhone simulator. Select a concrete UDID that exists on a
      # real runtime; do not pair the first simctl iPhone name with OS=latest.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys

          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") and "iPhone" in name:
                      candidates.append((runtime, name, device["udid"]))
          if not candidates:
              print("no available iPhone simulator found", file=sys.stderr)
              sys.exit(1)
          candidates.sort(key=lambda item: (item[0], item[1]))
          latest_runtime = candidates[-1][0]
          runtime, name, udid = next(
              item for item in candidates if item[0] == latest_runtime
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"udid={udid}\n")
          print(f"using simulator: {name} ({runtime}) {udid}")
          PY

      - name: Run unit tests
        working-directory: examples/ios
        run: >-
          xcodebuild -project RblueExample.xcodeproj -scheme RblueExample
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath build/DerivedData
          test CODE_SIGNING_ALLOWED=NO
