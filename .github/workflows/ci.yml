name: CI

# macOS self-hosted subset for the repository-only rblue-m4 runner.
# This is not a full platform matrix: Linux and Windows *runtime* tests are
# not executed here and must not be treated as green. Cross-compile checks
# are labeled as such. GitHub-hosted jobs live in ci-hosted.yml and are
# workflow_dispatch only while hosted billing is blocked.
#
# Trusted-code only: same-repository refs. Forking is disabled on this
# private repo; the job `if` still rejects a pull_request whose head is
# from another repository. No pull_request_target.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  rustfmt:
    name: rustfmt
    if: ${{ github.repository == 'rblue-rs/rblue' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, rblue-m4, rblue-trusted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (macos-host)
    if: ${{ github.repository == 'rblue-rs/rblue' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, rblue-m4, rblue-trusted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Clippy the workspace on this macOS host
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (macos-host)
    if: ${{ github.repository == 'rblue-rs/rblue' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, rblue-m4, rblue-trusted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the workspace on this macOS host
        run: cargo test --workspace

  docs:
    name: rustdoc (macos-host)
    if: ${{ github.repository == 'rblue-rs/rblue' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, rblue-m4, rblue-trusted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: rustdoc the workspace on this macOS host
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm32:
    name: check (wasm32-unknown-unknown, cross)
    if: ${{ github.repository == 'rblue-rs/rblue' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, rblue-m4, rblue-trusted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: cargo check wasm32 (not a browser runtime test)
        run: >-
          cargo check --workspace
          --exclude rblue-winrt
          --exclude rblue-corebluetooth
          --exclude rblue-bluez
          --exclude rblue-android
          --exclude rblue-ffi
          --exclude rblue-c
          --target wasm32-unknown-unknown

  cross-apple:
    name: check (aarch64-apple-ios, cross)
    if: ${{ github.repository == 'rblue-rs/rblue' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, rblue-m4, rblue-trusted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: cargo check iOS target (not a device runtime test)
        run: cargo check -p rblue-corebluetooth --target aarch64-apple-ios

  cross-android:
    name: check (aarch64-linux-android, cross)
    if: ${{ github.repository == 'rblue-rs/rblue' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, rblue-m4, rblue-trusted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: cargo check Android target (not a device or JVM runtime test)
        run: cargo check -p rblue-android --target aarch64-linux-android

  cross-ohos:
    name: check (aarch64-unknown-linux-ohos, cross)
    if: ${{ github.repository == 'rblue-rs/rblue' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, rblue-m4, rblue-trusted]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: cargo check OHOS target (not a device runtime test)
        run: cargo check -p rblue-ohos --target aarch64-unknown-linux-ohos
