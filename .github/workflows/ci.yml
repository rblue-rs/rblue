name: CI

# Plan §7 matrix, hosted-runner subset. The hardware-in-loop job (nRF52840
# DK contract tests) needs a self-hosted runner and stays out of this file.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # rblue-bluez builds its Linux glue natively here; libdbus is needed by
      # btleplug's bluez implementation.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Default quality gate: the workspace run now includes
      # tests/contract_mock.rs (MockAdapter::with_contract_fixture). The
      # explicit follow-up keeps that suite visible in CI logs and honors
      # the historical `--features contract` invocation.
      - run: cargo test --workspace
      - name: Mock contract suite
        run: cargo test -p rblue-api --features contract --test contract_mock

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm32:
    name: check (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Platform shells (winrt/corebluetooth/bluez/android) are single-platform
      # by design and stay out of the wasm32 matrix; see AGENTS.md.
      - run: >-
          cargo check --workspace
          --exclude rblue-winrt
          --exclude rblue-corebluetooth
          --exclude rblue-bluez
          --exclude rblue-android
          --target wasm32-unknown-unknown

  cross-apple:
    name: check (aarch64-apple-ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rblue-corebluetooth --target aarch64-apple-ios

  cross-windows:
    name: check (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rblue-winrt

  cross-android:
    name: check (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rblue-android --target aarch64-linux-android

  cross-ohos:
    name: check (aarch64-unknown-linux-ohos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rblue-ohos --target aarch64-unknown-linux-ohos
