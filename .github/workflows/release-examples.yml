name: Release examples

# One release, four independent build jobs. A release is only created after
# every example artifact has built and tested successfully.
on:
  push:
    tags:
      - "examples-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing examples-v* tag to publish
        required: true
        type: string
      draft:
        description: Create/update as a draft release
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.41.7"

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
            git rev-parse "refs/tags/$tag" >/dev/null 2>&1 || {
              echo "tag $tag does not exist" >&2; exit 1;
            }
            draft="${INPUT_DRAFT:-true}"
            prerelease="${INPUT_PRERELEASE:-false}"
          else
            tag="$PUSH_TAG"
            draft="false"
            prerelease="${tag#*-rc.}"
            [[ "$tag" == *-rc.* ]] && prerelease="true" || prerelease="false"
          fi
          [[ "$tag" =~ ^examples-v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]] || {
            echo "tag must match examples-vX.Y.Z or examples-vX.Y.Z-rc.N" >&2
            exit 1
          }
          version="${BASH_REMATCH[1]}"
          numeric="${BASH_REMATCH[1]}"
          IFS=. read -r major minor patch <<<"$numeric"
          build_number=$((major * 1000000 + minor * 1000 + patch))
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build_number=$build_number"
            echo "draft=$draft"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  android-native:
    name: Native Android examples
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build UniFFI libraries and Kotlin bindings
        run: examples/android/scripts/build-bindings.sh
      - name: Verify generated Kotlin bindings
        run: git diff --exit-code -- bindings/kotlin/generated
      - name: Test and build real/mock variants
        working-directory: examples/android
        env:
          RBLUE_VERSION_NAME: ${{ needs.metadata.outputs.version }}
          RBLUE_VERSION_CODE: ${{ needs.metadata.outputs.build_number }}
        run: |
          ./gradlew test \
            :app:assembleRealDebug :app:assembleMockDebug \
            :rblue:assembleRelease :app:assembleRelease
      - name: Stage release assets
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp examples/android/app/build/outputs/apk/real/debug/app-real-debug.apk \
            "release-assets/rblue-example-android-real-v${VERSION}-debug.apk"
          cp examples/android/app/build/outputs/apk/mock/debug/app-mock-debug.apk \
            "release-assets/rblue-example-android-mock-v${VERSION}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-native
          path: release-assets/*
          if-no-files-found: error

  flutter-android:
    name: Flutter Android example
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: examples/flutter/tools/build-libs.sh --android-only
      - name: Verify plugin and generated FFI binding
        working-directory: examples/flutter
        run: |
          flutter pub get
          dart run ffigen --config ffigen.yaml
          git diff --exit-code -- rblue_flutter/lib/src/ffi_bindings.dart
          (cd rblue_flutter && flutter analyze && flutter test)
          flutter analyze
          flutter test
      - name: Build debug APK
        working-directory: examples/flutter
        run: >-
          flutter build apk --debug
          --build-name '${{ needs.metadata.outputs.version }}'
          --build-number '${{ needs.metadata.outputs.build_number }}'
      - name: Stage release asset
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p release-assets
          cp examples/flutter/build/app/outputs/flutter-apk/app-debug.apk \
            "release-assets/rblue-example-flutter-android-v${VERSION}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-flutter-android
          path: release-assets/*
          if-no-files-found: error

  ios-native:
    name: Native iOS example and Swift SDK
    needs: metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: examples/ios/scripts/build-frameworks.sh
      - name: Verify generated Swift binding
        run: git diff --exit-code -- bindings/swift/generated bindings/swift/Rblue/Sources/Rblue
      - name: Generate project and run tests
        working-directory: examples/ios
        run: |
          xcodegen generate
          udid="$(xcrun simctl list devices available -j | \
            python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for xs in d.values() for x in xs if x["name"].startswith("iPhone")))')"
          xcodebuild -project RblueExample.xcodeproj -scheme RblueExample \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/DerivedData test CODE_SIGNING_ALLOWED=NO
      - name: Build Release applications
        working-directory: examples/ios
        run: |
          xcodebuild -project RblueExample.xcodeproj -scheme RblueExample \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ReleaseDerivedData build CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION='${{ needs.metadata.outputs.version }}' \
            CURRENT_PROJECT_VERSION='${{ needs.metadata.outputs.build_number }}'
          xcodebuild -project RblueExample.xcodeproj -scheme RblueExample \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/ReleaseDerivedData build CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION='${{ needs.metadata.outputs.version }}' \
            CURRENT_PROJECT_VERSION='${{ needs.metadata.outputs.build_number }}'
      - name: Stage release assets
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets swift-sdk/Rblue
          ditto -c -k --sequesterRsrc --keepParent \
            examples/ios/build/ReleaseDerivedData/Build/Products/Release-iphonesimulator/RblueExample.app \
            "release-assets/rblue-example-ios-simulator-arm64-v${VERSION}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            examples/ios/build/ReleaseDerivedData/Build/Products/Release-iphoneos/RblueExample.app \
            "release-assets/rblue-example-ios-device-arm64-v${VERSION}-unsigned.app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            bindings/swift/Rblue/Rblue.xcframework \
            "release-assets/rblue-ios-xcframework-v${VERSION}.zip"
          cp -R bindings/swift/Rblue/Package.swift bindings/swift/Rblue/Sources \
            bindings/swift/Rblue/Rblue.xcframework swift-sdk/Rblue/
          cp LICENSE-MIT LICENSE-APACHE swift-sdk/
          ditto -c -k --sequesterRsrc --keepParent swift-sdk \
            "release-assets/rblue-swift-sdk-v${VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios-native
          path: release-assets/*
          if-no-files-found: error

  flutter-ios:
    name: Flutter iOS example
    needs: metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: examples/flutter/tools/build-libs.sh --ios-only
      - name: Test plugin and app
        working-directory: examples/flutter
        run: |
          flutter pub get
          (cd rblue_flutter && flutter analyze && flutter test)
          flutter analyze
          flutter test
      - name: Build simulator and unsigned device apps
        working-directory: examples/flutter
        run: |
          flutter build ios --simulator --debug \
            --build-name '${{ needs.metadata.outputs.version }}' \
            --build-number '${{ needs.metadata.outputs.build_number }}'
          rm -rf build/release-staging
          mkdir -p build/release-staging
          cp -R build/ios/iphonesimulator/Runner.app \
            build/release-staging/Runner-simulator.app
          flutter build ios --release --no-codesign \
            --build-name '${{ needs.metadata.outputs.version }}' \
            --build-number '${{ needs.metadata.outputs.build_number }}'
      - name: Stage release assets
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            examples/flutter/build/release-staging/Runner-simulator.app \
            "release-assets/rblue-example-flutter-ios-simulator-arm64-v${VERSION}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            examples/flutter/build/ios/iphoneos/Runner.app \
            "release-assets/rblue-example-flutter-ios-device-arm64-v${VERSION}-unsigned.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-flutter-ios
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [metadata, android-native, flutter-android, ios-native, flutter-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.metadata.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and release notes
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          cat > release-notes.md <<EOF
          # rblue examples ${VERSION}

          Example binaries for the native Android/iOS and Flutter binding paths.

          - Android APKs use debug signing and are intended for examples/testing.
            A different debug key on a later release may require uninstalling the
            previous app before installation.
          - `*-simulator-arm64-*.app.zip` runs on Apple Silicon iOS simulators.
          - `*-device-arm64-*-unsigned.app.zip` is an unsigned build artifact,
            not an installable IPA. Device distribution requires Apple signing.
          - BLE behavior still requires physical hardware; simulator/mock builds
            validate packaging and UI behavior only.
          - Verify downloads with `SHA256SUMS.txt`.
          EOF
      - name: Create or update release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          DRAFT: ${{ needs.metadata.outputs.draft }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--title "$TAG" --notes-file release-notes.md --verify-tag)
          [[ "$DRAFT" == "true" ]] && args+=(--draft)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md \
              --draft="$DRAFT" --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" release-assets/* --clobber
