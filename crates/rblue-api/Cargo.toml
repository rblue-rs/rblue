[package]
name = "rblue-api"
description = "Core traits, error model, and capability negotiation for the rblue cross-platform BLE library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["bluetooth", "ble", "async", "gatt"]
categories = ["hardware-support"]

[features]
default = []
# serde support for FFI / driver-protocol payloads. Opt-in so the default
# build stays a pure, dependency-light Rust core. bitflags/serde gives the
# bitflag types a "|"-separated flag-name string representation.
serde = ["dep:serde", "bitflags/serde"]
# Compatibility alias: the contract suite is always compiled. Retained so
# `cargo test -p rblue-api --features contract` keeps working.
contract = []

[dependencies]
async-trait = { workspace = true }
bitflags = { workspace = true }
futures = { workspace = true }
# Runtime-agnostic timers (connection backoff, GATT queue timeouts). No async
# runtime ever enters this crate; wasm32 builds swap in the JS-event-loop
# Delay implementation via the target-specific dependency below.
futures-timer = { workspace = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# On wasm32 the base build has no OS entropy and no thread-based global
# timer: uuid needs the `js` feature (crypto.getRandomValues through
# wasm-bindgen) and futures-timer must drive delays from the JS event loop.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
futures-timer = { workspace = true }
proptest = { workspace = true }
rblue-mock = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
