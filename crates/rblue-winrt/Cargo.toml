[package]
name = "rblue-winrt"
description = "Windows (WinRT) backend for rblue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
btleplug = { git = "https://github.com/rblue-rs/btleplug", rev = "983f3f1346bb1646281e0faf345a21c4a787833d" }
futures = { workspace = true }
rblue-api = { workspace = true }
# Minimal feature set so the crate also compiles on non-Windows targets
# (the glue is `cfg(windows)`; `net`/`full` would pull mio everywhere).
tokio = { version = "1", default-features = false, features = ["sync", "rt", "macros", "time"] }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "rt", "macros", "time"] }
